# mockery generates code from interfaces selected here using templates.
# Each template kind has an anchor; an interface uses one (config) or several (configs).
log-level: warn
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/powerman/go-scripts-example
_anchors:
  fake: &fake
    template: file://.mockery/fake.templ
    dir: '{{.InterfaceDir}}'
    pkgname: '{{.SrcPackageName}}_test'
    filename: 'fake.{{.InterfaceFile | base | trimSuffix ".go"}}_test.go'
    structname: 'Fake{{.InterfaceName | firstUpper}}'
packages:
  # Every package of every program is scanned for World,
  # so a new program gets its Fake without a change here.
  github.com/powerman/go-scripts-example/scripts:
    config:
      !!merge <<: *fake
      recursive: true
      include-interface-regex: '^World$'
