# mockery generates code from interfaces listed here using templates.
# Each template kind has an anchor; an interface uses one (config) or several (configs).
log-level: warn
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/powerman/go-scripts-example
_anchors:
  fake: &fake
    template: file://.mockery/fake.templ
    dir: '{{.InterfaceDir}}'
    pkgname: '{{.SrcPackageName}}_test'
    filename: 'fake.{{.InterfaceFile | base | trimSuffix ".go"}}_test.go'
    structname: 'Fake{{.InterfaceName | firstUpper}}'
packages:
  github.com/powerman/go-scripts-example/scripts/lint-docs/internal:
    interfaces:
      World:
        config: *fake
  github.com/powerman/go-scripts-example/scripts/lint-links/internal:
    interfaces:
      World:
        config: *fake
  github.com/powerman/go-scripts-example/scripts/test-qemu/internal:
    interfaces:
      World:
        config: *fake
  github.com/powerman/go-scripts-example/scripts/toc/internal:
    interfaces:
      World:
        config: *fake
