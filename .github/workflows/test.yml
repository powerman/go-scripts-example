name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel testing of a previous commit for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
      - run: git reset --hard # Work around https://github.com/jdx/mise/discussions/8270.

      - uses: powerman/.github/.github/actions/cache-go-and-tools@main

      - run: mise run ci

  # mise runs tasks on Windows by cmd, so tasks which run scripts have own commands there.
  # Some tools of mise.toml may be unavailable on Windows,
  # so only tools needed to build and test Go scripts are installed.
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: false # Do not install other tools of mise.toml on `mise run`.

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: go gotestsum usage
      - run: git reset --hard # Work around https://github.com/jdx/mise/discussions/8270.

      - uses: powerman/.github/.github/actions/cache-go-and-tools@main

      - run: mise run scripts:test
      - run: mise run lint:docs

  # Testing on available native platforms.
  # Go scripts don't need mise: they are built and run by Go alone.
  native:
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04-arm} # Linux ARM64
          - {os: macos-15-intel} # macOS AMD64
          - {os: macos-latest} # macOS ARM64
          - {os: windows-11-arm} # Windows ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SCRIPTS_BIN: ${{ github.workspace }}/.cache/scripts
      KONGUSAGE_TEST_SKIP_USAGE: 1 # Tool usage of mise.toml is not installed here.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'scripts/go.mod'
          cache-dependency-path: 'scripts/go.sum'

      - run: go -C scripts test -timeout=60s -race ./...
        if: matrix.os != 'windows-11-arm'
      - run: go -C scripts test -timeout=60s ./...
        if: matrix.os == 'windows-11-arm'

      - run: go -C scripts build -o "$SCRIPTS_BIN/" ./...
      - run: '"$SCRIPTS_BIN/lint-docs"'

  # Testing on available docker QEMU platforms (Linux only).
  qemu:
    strategy:
      matrix:
        include:
          - {arch: arm, v: v7}
          - {arch: ppc64le}
          - {arch: s390x}
          - {arch: riscv64}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.arch }}

      - uses: powerman/.github/.github/actions/cache-go-and-tools@main
        with:
          key: qemu-${{ matrix.arch }}${{ matrix.v && format('-{0}', matrix.v) || '' }}

      - name: Run tests
        env:
          PLATFORM: linux/${{ matrix.arch }}${{ matrix.v && format('/{0}', matrix.v) || '' }}
        run: |
          mkdir -p ~/go ~/.cache/go-build
          V=$(awk '$1=="toolchain"{v=$2}$1=="go"&&!v{v=$2}END{sub(/^go/,"",v);print v}' scripts/go.mod)
          docker run --rm --platform "$PLATFORM" \
            -w /workspace \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/go-build:/root/.cache/go-build" \
            -v "$HOME/go:/go" \
            -e KONGUSAGE_TEST_SKIP_USAGE=1 \
            -e SCRIPTS_BIN=/workspace/.cache/scripts \
            "golang:${V}-alpine" sh -e -c '
              apk add --no-cache git >/dev/null
              git config --global --add safe.directory /workspace
              go -C scripts test -timeout=60s ./...
              go -C scripts build -o "$SCRIPTS_BIN/" ./...
              "$SCRIPTS_BIN/lint-docs"
            '

  # Aggregate job for branch protection.
  test:
    needs: [main, windows, native, qemu]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any dependency failed, cancelled or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
