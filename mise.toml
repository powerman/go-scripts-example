# jdx/mise-action installs only releases older than a day, so a newer one would fail CI.
min_version = '2026.10.19'

[settings]
lockfile = true # DO NOT FORGET TO `touch mise.lock` if mise.lock does not exist!
npm.package_manager = 'pnpm' # Avoid .mise/locks/** sidecars required by default aube.


[task_config]
includes = ['mise/tasks', 'scripts/tasks.toml']


[tools]
node = 'lts'
pnpm = 'latest'
go = 'latest'
# A specification for CLIs.
# - Used in Go tests for Kong CLI.
usage = 'latest'

#--- Generate
# Generates code from Go interfaces using templates (used for mocks and adapters).
'go:github.com/vektra/mockery/v3' = 'latest'
# MockGen generates mock implementations of Go interfaces.
'go:go.uber.org/mock/mockgen' = 'latest'

#--- Format
# Opinionated Code Formatter.
prettier = 'latest'
# A TOML toolkit written in Rust.
taplo = 'latest'
# An extensible command line tool or library to format yaml files.
yamlfmt = 'latest'

#--- Lint
# Static checker for GitHub Actions workflow files.
actionlint = 'latest'
# Fast linters runner for Go.
golangci-lint = '2.15' # Version must match .golangci.yml.

#--- Test
# 'go test' runner with output optimized for humans.
gotestsum = 'latest'

#--- Release
# A highly customizable Changelog Generator that follows Conventional Commit specifications.
git-cliff = 'latest'
# GitHub's official command line tool.
gh = 'latest'


[env]
SCRIPTS_BIN = '{{config_root}}/.cache/scripts' # Go scripts built by scripts:build.
PNPM_CONFIG_VIRTUAL_STORE_TYPE = 'project' # Fixed in 2026.11.1, remove after updating min_version.


[vars]
scripts_cover = '.cache/scripts.cover.out'


# Tasks which read files must not run in parallel with tasks which write them.
# Tasks which combine them SHOULD set a safe order by groups of tasks in `run`:
# groups run one after another, tasks of one group run in parallel.
# Use `depends` only for tasks which are safe to run in parallel.
#
# Each run-group has own graph of dependencies,
# and `wait_for` works only inside of one graph.
# A task reached from two run-groups runs twice,
# unless an earlier run-group of the same `run` lists it or has it in `depends` of listed tasks
# (their `depends_post` and `run` don't count).
#
# An alternative is `depends` with `wait_for` between readers and writers.
# Avoid it or be careful: it's easy to make a mistake there and get a non-obvious race.

[tasks.default]
description = 'Run all formatters, linters and tests'
run = [
    { task = 'fmt' },
    { tasks = ['lint', 'test'] },
]

[tasks.bump]
description = 'Upgrade everything'
# Avoid `run=[{ task = … }]` here to make sure commands will use tools updated by `mise up`.
run = '''
mise up --local
mise run scripts:bump
'''

[tasks.generate]
description = 'Generate everything'
depends = ['scripts:generate']

[tasks.fmt]
description = 'Format all files'
# Configs of formatters are YAML and TOML files too,
# and a formatter must not read a config while it's being rewritten.
# toc and fmt:markdown both rewrite markdown files.
run = [
    { task = 'fmt:yaml' },
    { task = 'fmt:toml' },
    { task = 'toc' },
    { tasks = ['fmt:*', 'scripts:fmt'] },
]

[tasks.lint]
description = 'Run all linters'
depends = ['lint:*', 'scripts:lint']

[tasks.test]
description = 'Run all tests'
depends = ['scripts:test']

[tasks.ci]
description = 'Run all CI tasks'
run = [
    { task = 'check-drift' },
    { tasks = ['lint', 'test'] },
]

[tasks.'fmt:markdown']
description = 'Format markdown files'
sources = ['**/*.md', '.prettier*', '.editorconfig', 'mise.lock']
run = 'prettier --write "**/*.md"'

[tasks.'fmt:toml']
description = 'Format TOML files'
sources = ['**/*.toml', 'mise.lock']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format"

[tasks.'fmt:yaml']
description = 'Format YAML files'
sources = ['**/*.yml', '**/*.yaml', 'mise.lock']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt"

[tasks.'lint:workflows']
description = 'Lint GitHub Action workflows'
run = 'actionlint'

[tasks.'lint:docs']
description = 'Check tables of contents and local links in markdown files'
depends = ['scripts:build']
usage = 'mount run="mise run -q lint:docs --usage-spec"'
raw_args = true
run = '"${SCRIPTS_BIN:?}/lint-docs"'
run_windows = '"%SCRIPTS_BIN%\lint-docs"'

[tasks.'lint:markdown']
description = 'Lint markdown files'
sources = ['**/*.md', '.prettier*', '.editorconfig', 'mise.lock']
run = 'prettier --check --log-level warn "**/*.md"'

[tasks.'lint:toml']
description = 'Check TOML files formatting'
sources = ['**/*.toml', 'mise.lock']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format --check"

[tasks.'lint:yaml']
description = 'Check YAML files formatting'
sources = ['**/*.yml', '**/*.yaml', 'mise.lock']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt -lint"

[tasks.'changelog:skip-commit']
description = 'Add commit hash to .cliffignore to exclude from CHANGELOG'
usage = 'arg "<commit>" help="Git revision (e.g. HEAD or a1b2c4d)"'
run = 'git rev-parse --verify "${usage_commit}" >> .cliffignore'

[tasks.toc]
description = 'Update tables of contents in markdown files'
depends = ['scripts:build']
usage = 'mount run="mise run -q toc --usage-spec"'
raw_args = true
run = '"${SCRIPTS_BIN:?}/toc"'
run_windows = '"%SCRIPTS_BIN%\toc"'

# Not test:qemu: it's slow and needs docker, so `test:*` of a project must not run it.
[tasks.test-qemu]
description = 'Test Go scripts on other platforms emulated by QEMU in docker'
depends = ['scripts:build']
usage = 'mount run="mise run -q test-qemu --usage-spec"'
raw_args = true
run = '"${SCRIPTS_BIN:?}/test-qemu"'
run_windows = '"%SCRIPTS_BIN%\test-qemu"'

[tasks.check-drift]
hide = true
run = [
    { task = 'generate' },
    { task = 'fmt' },
    { task = 'is-workdir-clean' },
]

[tasks.is-workdir-clean]
hide = true
run = '! git status --porcelain | grep .'
run_windows = 'powershell -c "$status = git status --porcelain; if ($status) { $status; exit 1 }"'

[tasks.cachedir]
hide = true
run = 'mkdir -p .cache'
